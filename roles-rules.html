<!-- Exec Properties -->

<box field="execProperties" hidden="true">
  <label
    label="Exec Properties"
    size="md"
    variant="bold"
    textalign="center"
  ></label>
  <label label="Features" size="sm" variant="bold"></label>
  <div style="display: flex; flex-direction: row; gap: 4px">
    <div style="width: 64px">
      <label label="Rank" size="xs" variant="bold"></label>
    </div>
    <div>
      <label label="Feature" size="xs" variant="bold"></label>
    </div>
  </div>
  <list variant="striped" field="features" listtype="basic_features"></list>
  <div
    style="
      display: flex;
      flex-direction: row;
      gap: 4px;
      width: 100%;
      margin-top: 4px;
    "
  >
    <div style="width: 100%">
      <label label="Gaining Loyalty" size="sm" variant="bold"></label>
      <div style="display: flex; flex-direction: row; gap: 4px">
        <div style="width: 64px">
          <label label="Amount" size="xs" variant="bold"></label>
        </div>
        <div>
          <label label="Description" size="xs" variant="bold"></label>
        </div>
      </div>
      <list
        variant="striped"
        field="loyaltyLosses"
        listtype="exec_loyalty_changes"
      ></list>
    </div>
    <div style="width: 100%">
      <label label="Losing Loyalty" size="sm" variant="bold"></label>
      <div style="display: flex; flex-direction: row; gap: 4px">
        <div style="width: 64px">
          <label label="Amount" size="xs" variant="bold"></label>
        </div>
        <div>
          <label label="Description" size="xs" variant="bold"></label>
        </div>
      </div>
      <list
        variant="striped"
        field="loyaltyGains"
        listtype="exec_loyalty_changes"
      ></list>
    </div>
  </div>
</box>

    label="Netrunner Properties"
    size="md"
    variant="bold"
    textalign="center"
  ></label>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <stringfield
      label="ZAP Damage"
      size="sm"
      field="zapDamage"
      placeholder="Enter ZAP damage..."
    ></stringfield>
    <label label="NET Actions by Rank" size="sm" variant="bold"></label>
    <table style="width: 250px">
      <thead>
        <tr>
          <th style="text-align: center; font-size: 14px">Rank</th>
          <th style="font-size: 14px">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="text-align: center"><strong>1</strong></td>
