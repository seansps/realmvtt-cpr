<script>
  function onRollLoyalty() {
    // Loyalty is just a d6 rolling under the loyalty stat
    const loyalty = record.data?.loyalty || 0;
    const loyaltyMetadata = {
      dv: loyalty,
    };
    api.promptRoll("Loyalty", "1d6", [], loyaltyMetadata, "loyalty");
  }
</script>
<label variant="bold" textalign="center" label="Additional Info"></label>

<div style="display: flex; flex-direction: row; gap: 4px">
  <numberfield
    size="xs"
    width="100px"
    field="reputation"
    label="Reputation"
    defaultvalue="0"
  ></numberfield>
  <box field="teamMemberLoyalty" hidden="true">
    <div
      style="
        display: flex;
        flex-direction: row;
        gap: 4px;
        align-items: flex-end;
      "
    >
      <numberfield
        size="xs"
        width="100px"
        field="loyalty"
        label="Loyalty"
        defaultvalue="0"
      ></numberfield>
      <iconbutton
        field="Roll Loyalty"
        size="md"
        variant="light"
        options='[{"icon": "IconDice", "label": "Roll Loyalty", "value": "roll"}]'
        onclick="onRollLoyalty()"
      ></iconbutton>
    </div>
  </box>
</div>
