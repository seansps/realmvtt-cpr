<script>
  function onDrop(type, recordLink) {
    const value = recordLink?.value;
    if (type === "npcs" && value?.data?.type === "demon") {
      onDemonDrop(value);
    }
  }

  function onShowHideAllFloors() {
    const floors = record?.data?.floors || [];
    // Get the first floor's hidden value, and set all floors to that value's opposite
    if (!floors || floors.length === 0) {
      return;
    }

    const firstFloor = floors[0];
    const hiddenValue = firstFloor?.data?.hidden === "true";
    const newHiddenValue = Boolean(!hiddenValue).toString();

    const valuesToSet = {};

    // Recursive function to process floors and their branches at any depth
    function processFloors(floors, basePath) {
      floors.forEach((floor, index) => {
        // Set hidden value for this floor
        valuesToSet[`${basePath}${index}.data.hidden`] = newHiddenValue;

        // Process branches if any
        const branches = floor?.data?.branches || [];
        branches.forEach((branch, branchIndex) => {
          // Process left branch
          const leftBranch = branch?.data?.branch_left || [];
          processFloors(
            leftBranch,
            `${basePath}${index}.data.branches.${branchIndex}.data.branch_left.`
          );

          // Process right branch
          const rightBranch = branch?.data?.branch_right || [];
          processFloors(
            rightBranch,
            `${basePath}${index}.data.branches.${branchIndex}.data.branch_right.`
          );
        });
      });
    }

    // Start processing from the top-level floors
    processFloors(floors, "data.floors.");

    // Apply all changes at once
    api.setValues(valuesToSet);
  }

  function onDemonDrop(record) {
    // Add the item and set the attunement hidden field to visible if requires attunement
    const itemToAdd = {
      ...record,
      _id: generateUuid(),
      icon: "IconRobot",
      data: {
        ...record?.data,
        // Track old ID for count tracking
        fromId: record._id,
      },
      fields: {
        ...record?.fields,
      },
    };

    const demons = record?.data?.installedDemons || [];

    api.addValue(`data.installedDemons`, itemToAdd);
  }

  function onFloorsChanged() {
    updateNetArchitectureBranchButtons(record);
  }
</script>

<div style="margin-top: 8px">
  <label
    variant="bold"
    label="Installed Demons"
    size="md"
    textalign="center"
  ></label>

  <list
    listtype="installed_demon_list"
    variant="outline-striped"
    field="installedDemons"
  ></list>
</div>

<div style="margin-top: 4px; margin-bottom: 4px">
  <divider color="primary" label="Floors"></divider>
</div>

<list
  listtype="net_architecture_floor_list"
  variant="standard"
  field="floors"
  onchange="onFloorsChanged()"
></list>

<div style="margin-top: 4px; display: flex; flex-direction: row; gap: 4px">
  <button
    variant="outline"
    size="sm"
    label="Show/Hide All Floors"
    onclick="onShowHideAllFloors()"
  ></button>
</div>
