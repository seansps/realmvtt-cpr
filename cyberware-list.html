<!-- This list is just the foundational cyberware equipped for a specific type -->
<script>
  const rollHumanityLoss = (name) => {
    const cyberwareDataPath = getNearestParentDataPath(dataPath);
    const cyberware = api.getValue(cyberwareDataPath);
    const baseLoss = `${cyberware.data?.baseHumanityLoss}` || "0";
    const rollLoss = cyberware.data?.humanityLoss || "1d6";
    const metadata = {
      // Always use base loss if base is selected, else check if half loss is enabled
      halfHumanityLoss:
        name === "Base" ? false : cyberware.data?.halfHumanityLoss || false,
      isBaseLoss: name === "Base",
    };

    api.closeOpenedPopovers();

    api.promptRoll(
      `${name} Humanity Loss`,
      name === "Base" ? baseLoss : rollLoss,
      [],
      metadata,
      "humanityLoss"
    );
  };

  function onMove(newLocation) {
    // Moves the cyberware in an arm/eye/leg to the left or right table
    const cyberwareDataPath = getNearestParentDataPath(dataPath);
    const cyberware = api.getValue(cyberwareDataPath);

    const valuesToSet = {};
    valuesToSet[`${cyberwareDataPath}.data.cyberLocation`] = newLocation;
    // Hide/unhide the move buttons
    valuesToSet[`${cyberwareDataPath}.fields.moveLeftBtn.hidden`] =
      newLocation === "left" ? true : false;
    valuesToSet[`${cyberwareDataPath}.fields.moveRightBtn.hidden`] =
      newLocation === "right" ? true : false;

    api.setValues(valuesToSet, (updatedRecord) => {
      // Update the cyberware slot values
      setCyberwareSlotValues(updatedRecord);
    });
  }
</script>

<div style="height: 30px; display: flex; gap: 4px; align-items: center">
  <div style="width: 30px; min-width: 30px">
    <portrait width="30px" height="30px" name="portrait"></portrait>
  </div>
  <div style="flex-grow: 1">
    <namefield
      size="xs"
      variant="standard"
      placeholder="Item"
      field="namefield"
    ></namefield>
  </div>
  <checkbox
    field="active"
    size="xs"
    label="Active"
    textalign="right"
  ></checkbox>
  <popover field="popover">
    <popover.target>
      <iconbutton
        size="md"
        hidden="true"
        field="humanityLossBtn"
        variant="default"
        options='[{"icon": "IconBrain", "label": "Roll Humanity Loss", "value": "humanityLoss"}]'
      ></iconbutton>
    </popover.target>
    <popover.dropdown>
      <label
        size="sm"
        variant="bold"
        textalign="center"
        label="Humanity Loss"
      ></label>
      <div style="display: flex; gap: 4px; align-items: center">
        <button
          field="baseLossBtn"
          size="sm"
          variant="outline"
          color="primary"
          label="Apply Base Loss"
          onclick="rollHumanityLoss('Base')"
        ></button>
        <button
          field="rollLossBtn"
          size="sm"
          variant="outline"
          color="secondary"
          label="Roll for Loss"
          onclick="rollHumanityLoss('Roll')"
        ></button>
      </div>
    </popover.dropdown>
  </popover>
  <iconbutton
    field="moveLeftBtn"
    size="md"
    hidden="true"

    options='[{"icon": "IconArrowDown", "label": "Move to Left", "value": "moveLeft"}]'

  ></iconbutton>
  <iconbutton
    field="moveRightBtn"
    size="md"

    onclick="onMove('right')"
  ></iconbutton>
</div>
