<script>
  function onUsedIPChange() {
    // Total up all the used IP values in the list
    let usedIP = 0;
    const usedIPList = record.data.ipSpent || [];
    usedIPList.forEach((usedEntry) => {
      const amountUsed = parseInt(usedEntry.data?.usedIP, 10);
      if (!isNaN(amountUsed) && amountUsed > 0) {
        usedIP += amountUsed;
      }
    });

    api.setValues({ "data.usedIP": usedIP });
  }

  function onReputationEventChange() {
    // Set the character's reputation to the highest value in the list
    // (or the lowest if negative)
    let highestRep = 0;
    let curHighestRep = 0;
    const repEventList = record.data.repEventList || [];
    repEventList.forEach((repEvent) => {
      const repValue = parseInt(repEvent.data?.reputation, 10);
      if (!isNaN(repValue) && Math.abs(repValue) > Math.abs(curHighestRep)) {
        curHighestRep = Math.abs(repValue);
        highestRep = repValue;
      } else if (
        !isNaN(repValue) &&
        Math.abs(repValue) === Math.abs(curHighestRep)
      ) {
        if (repValue > 0) {
          highestRep = repValue;
        }
      }
    });

    api.setValues({ "data.reputation": highestRep });
  }

  function onReputationCheck() {
    api.closeOpenedPopovers();
    api.promptRoll(
      `Reputation Check`,
      "1d10",
      [],
      {
        dv: record.data?.reputation || 0,
      },
      "reputation"
    );
  }

  function onReputationFaceDown() {
    api.closeOpenedPopovers();
    performFaceDownRoll(record);
  }
</script>
