<script>
  function showHideValues(typeStr) {
    const valuesToSet = {
      "fields.weaponProperties.hidden": true,
      "fields.packProperties.hidden": true,
      "fields.rangedWeaponProperties.hidden": true,
      "fields.weaponType.hidden": true,
      "fields.ammoType.hidden": true,
      "fields.magazine.hidden": true,
    };

    if (typeStr === "agent app") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "armor") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "black ice") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "cyberdeck") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = true;
    } else if (typeStr === "cyberware") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = true;
    } else if (typeStr === "demon") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "drone") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "drug") {
      valuesToSet["fields.consumable.hidden"] = false;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "fashion") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = true;
    } else if (typeStr === "gear") {
      valuesToSet["fields.consumable.hidden"] = false;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "melee weapon") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
      valuesToSet["fields.weaponProperties.hidden"] = false;
      valuesToSet["fields.weaponType.hidden"] = false;
      // Defaults for melee weapons
      valuesToSet["data.weaponSkill"] = "brawling";
      valuesToSet["data.rof"] = "1";
      valuesToSet["data.handsRequired"] = "1";
      valuesToSet["data.quality"] = "average";
      valuesToSet["data.exotic"] = "false";
      valuesToSet["data.concealable"] = "false";
    } else if (typeStr === "program or hardware") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "ranged weapon") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
      valuesToSet["fields.weaponProperties.hidden"] = false;
      valuesToSet["fields.rangedWeaponProperties.hidden"] = false;
      valuesToSet["fields.ammoType.hidden"] = false;
      valuesToSet["fields.magazine.hidden"] = false;
      // Defaults for ranged weapons
      valuesToSet["data.weaponSkill"] = "archery";
      valuesToSet["data.rof"] = "1";
      valuesToSet["data.handsRequired"] = "1";
      valuesToSet["data.quality"] = "average";
      valuesToSet["data.exotic"] = "false";
      valuesToSet["data.concealable"] = "false";
    } else if (typeStr === "pack") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = true;
      valuesToSet["fields.packProperties.hidden"] = false;
    } else if (typeStr === "vehicle") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = false;
    } else if (typeStr === "vehicle upgrade") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = true;
    } else if (typeStr === "weapon attachment") {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = true;
    } else {
      valuesToSet["fields.consumable.hidden"] = true;
      valuesToSet["fields.hasUseBtn.hidden"] = true;
    }

    api.setValues(valuesToSet);
  }

  function showHideUseValues(value) {
    const valuesToSet = {};

    if (value) {
      valuesToSet["fields.consumableProperties.hidden"] = false;
    } else if (!record.data?.consumable) {
      valuesToSet["fields.consumableProperties.hidden"] = true;
    }

    api.setValues(valuesToSet);
  }

  function showHideConsumableValues(value) {
    const valuesToSet = {};

    if (value) {
      valuesToSet["fields.consumableProperties.hidden"] = false;
    } else if (!record.data?.hasUseBtn) {
      valuesToSet["fields.consumableProperties.hidden"] = true;
    }

    api.setValues(valuesToSet);
  }

  function getWeaponSkillOptions() {
    const itemType = record.data?.type;
    if (itemType === "melee weapon") {
      return [
        { label: "Brawling", value: "brawling" },
        { label: "Martial Arts", value: "martial arts" },
        { label: "Melee Weapon", value: "melee weapon" },
      ];
    }
    return [
      { label: "Archery", value: "archery" },
      { label: "Autofire", value: "autofire" },
      { label: "Handgun", value: "handgun" },
      { label: "Heavy Weapons", value: "heavy weapons" },
      { label: "Shoulder Arms", value: "shoulder arms" },
      { label: "Pilot Sea Vehicle", value: "pilot sea vehicle" },
      { label: "Pilot Air Vehicle", value: "pilot air vehicle" },
      { label: "Drive Land Vehicle", value: "drive land vehicle" },
      { label: "Drive Sea Vehicle", value: "drive sea vehicle" },
      { label: "Drive Air Vehicle", value: "drive air vehicle" },
    ];
  }

  function onAutofireChange(value) {
    if (value) {
      api.setValues({ "fields.afDvProperties.hidden": false });
    } else {
      api.setValues({ "fields.afDvProperties.hidden": true });
    }
  }

  function onCostChange(value) {
    const valuesToSet = {
      "data.priceCategory": "cheap",
    };

    // Convert value to a number to ensure proper comparisons
    const numValue = parseFloat(value.replace(/[a-zA-Z,]/g, "")) || 0;

    if (numValue >= 10000) {
      valuesToSet["data.priceCategory"] = "super luxury";
    } else if (numValue >= 5000) {
      valuesToSet["data.priceCategory"] = "luxury";
    } else if (numValue >= 1000) {
      valuesToSet["data.priceCategory"] = "very expensive";
    } else if (numValue >= 500) {
      valuesToSet["data.priceCategory"] = "expensive";
    } else if (numValue >= 100) {
      valuesToSet["data.priceCategory"] = "premium";
    } else if (numValue >= 50) {
      valuesToSet["data.priceCategory"] = "costly";
    } else if (numValue >= 20) {
      valuesToSet["data.priceCategory"] = "everyday";
    } else if (numValue >= 10) {
      valuesToSet["data.priceCategory"] = "cheap";
    } else if (numValue <= 5) {
      valuesToSet["data.priceCategory"] = "dirt cheap";
    } else {
      // For values between 5 and 10
      valuesToSet["data.priceCategory"] = "cheap";
    }

    // Ensure there is a defined type, for the purpose of filtering
    if (!record.data?.type) {
      valuesToSet["data.type"] = "gear";
    }

    // Apply the changes to the data model
    api.setValues(valuesToSet);
  }
</script>
