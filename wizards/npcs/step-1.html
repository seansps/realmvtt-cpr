<script>
  // Step 1: threat tier, optional role and gang, and how to start.
  // Leaving this step (re)builds steps 2-4 whenever these choices changed, so
  // going Back and Next without changes keeps any edits made later.

  function npcwOnTierChange(value) {
    const tier = NPCB_TIERS[value];
    api.setValues({
      "data.wizard.tierInfo": tier ? tier.guidance : "",
    });
  }

  function onStepEnd(stepIndex) {
    api.getRecord("npcs", record._id, (current) => {
      const w = current.data?.wizard || {};
      const choices = {
        tier: w.tier || "mook",
        role: w.role || "",
        gang: w.gang || "",
        source: w.source || "random",
      };
      const buildKey = [
        choices.tier,
        choices.role,
        choices.gang,
        choices.source,
      ].join("|");
      if (w.builtKey === buildKey) {
        return;
      }
      const spec = npcbBuildSpec(choices);
      const values = npcbSpecToWizardValues(spec);
      values["data.wizard.builtKey"] = buildKey;
      values["data.wizard.derivedText"] = npcbDerivedText(spec.stats, spec.tier);
      values["data.wizard.skillPreview"] = npcbSkillPreviewText(
        spec.skillText,
        spec.roleAbilities,
        spec.stats
      );
      api.setValues(values);
    });
  }
</script>
