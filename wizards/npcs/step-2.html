<script>
  // Step 2: STATs. Rolled instantly on the Role's Edgerunner table (any Role's
  // table per STAT when there is no Role), then fit to the tier.

  function npcwWizardStats() {
    const stats = {};
    NPCB_STATS.forEach((stat) => {
      stats[stat] = parseInt(api.getValue(`data.wizard.${stat}`) || 0, 10) || 0;
    });
    return stats;
  }

  // The changed field may not be saved yet, so use the new value directly
  function npcwOnStatChange(changedStat, newValue) {
    const stats = npcwWizardStats();
    stats[changedStat] = parseInt(newValue || 0, 10) || 0;
    api.setValues({
      "data.wizard.derivedText": npcbDerivedText(
        stats,
        api.getValue("data.wizard.tier")
      ),
    });
  }

  function npcwRollStats() {
    const tier = api.getValue("data.wizard.tier") || "mook";
    const role = api.getValue("data.wizard.role") || "";
    const stats = npcbRollStats(tier, role);
    const values = {};
    NPCB_STATS.forEach((stat) => {
      values[`data.wizard.${stat}`] = stats[stat];
    });
    values["data.wizard.derivedText"] = npcbDerivedText(stats, tier);
    api.setValues(values);
  }
</script>

<div style="display: flex; flex-direction: column; gap: 8px">

    size="sm"

    <button
      onclick="npcwRollStats()"
