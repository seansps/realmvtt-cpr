<script>
  // Configuration - TODO allow GM to adjust this later via campaign settings
  const STARTING_STAT_POINTS = 62;

  function onStepEnd(stepIndex) {
    // This is called when the user goes to the next step.
    // All fields in the wizard are available in the record's 'data.wizard' context.
  }

  function rollStatsForRole() {
    // Get the current record to access wizard data
    api.getRecord("characters", record._id, (currentRecord) => {
      const role = currentRecord.data?.wizard?.role;
      const creationMethod = currentRecord.data?.wizard?.creationMethod;

      if (creationMethod !== "streetrat") {
        api.showNotification(
          "This function is only available for Streetrat method!",
          "yellow",
          "Warning"
        );
        return;
      }

      if (!role) {
        api.showNotification(
          "Please select a valid role in Step 1 first!",
          "yellow",
          "Error"
        );
        return;
      }

      // Roll immediately
      api.roll(
        "1d10",
        {
          role: role,
          method: creationMethod,
        },
        "wizardStatsRoll"
      );
    });
  }

  function rollStat(statName) {
    // Get the current record to access wizard data
    api.getRecord("characters", record._id, (currentRecord) => {
      const role = currentRecord.data?.wizard?.role;
      const creationMethod = currentRecord.data?.wizard?.creationMethod;

      if (creationMethod !== "edgerunner") {
        api.showNotification(
          "This function is only available for Edgerunner method!",
          "yellow",
          "Warning"
        );
        return;
      }

      if (!role) {
        api.showNotification(
          "Please select a valid role in Step 1 first!",
          "yellow",
          "Error"
        );
        return;
      }

      // Roll for individual stat
      api.roll(
        "1d10",
        {
          role: role,
          method: creationMethod,
          stat: statName,
        },
        "wizardStatsRoll"
      );
    });
  }

  function onStatChange(value, field) {
    const creationMethod = api.getValue("data.wizard.creationMethod");

    if (creationMethod !== "complete") {
      return; // Only handle changes for Complete Package method
    }

    // Get all current stat values
    const int = api.getValue("data.wizard.int") || 2;
    const ref = api.getValue("data.wizard.ref") || 2;
    const dex = api.getValue("data.wizard.dex") || 2;
    const tech = api.getValue("data.wizard.tech") || 2;
    const cool = api.getValue("data.wizard.cool") || 2;
    const will = api.getValue("data.wizard.will") || 2;
    const luck = api.getValue("data.wizard.luck") || 2;
    const move = api.getValue("data.wizard.move") || 2;
    const body = api.getValue("data.wizard.body") || 2;
    const emp = api.getValue("data.wizard.emp") || 2;

    const valuesToSet = {};

    // Calculate total points used (each stat point costs 1 point from the pool)
    let currentPoints = 0;
    let hasInvalidStats = false;

    for (const stat of [
      int,
      ref,
      dex,
      tech,
      cool,
      will,
      luck,
      move,
      body,
      emp,
    ]) {
      if (stat < 2 || stat > 8) {
        hasInvalidStats = true;
      }
      currentPoints += stat;
    }

    const remainingPoints = `${currentPoints} / ${STARTING_STAT_POINTS}`;
    valuesToSet["data.wizard.remainingPoints"] = remainingPoints;

    let error = false;
    let errorMsg = "";

    if (hasInvalidStats) {
      errorMsg = "All stats must be between 2 and 8.";
      error = true;
    } else if (currentPoints > STARTING_STAT_POINTS) {
      errorMsg = `You have exceeded the maximum points (${STARTING_STAT_POINTS}).`;
      error = true;
    } else if (currentPoints < STARTING_STAT_POINTS) {
      errorMsg = `You have not spent all of your points (${STARTING_STAT_POINTS}).`;
      error = true;
    } else {
      errorMsg = "Stats allocated successfully!";
      error = false;
    }

    valuesToSet["data.wizard.pointBuyMsg"] = errorMsg;

    // Show/hide error message and set color
    if (error) {
      valuesToSet["fields.pointBuyMsg.hidden"] = false;
      valuesToSet["fields.pointBuyMsg.color"] = "red";
    } else {
      valuesToSet["fields.pointBuyMsg.hidden"] = false;
      valuesToSet["fields.pointBuyMsg.color"] = "green";
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }
</script>
