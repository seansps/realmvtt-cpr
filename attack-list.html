<script>
  function rollAttack(type, range = "auto") {
    // Close the popover if it's open
    api.closeOpenedPopovers();
    // Get weapon path
    const weaponDataPath = getNearestParentDataPath(dataPath);
    const weapon = api.getValue(weaponDataPath);

    const isMelee = weapon.data?.type === "melee weapon";

    let isShell = false;
    // It's a shotgun shell if it's ranged with a isShell ammo
    const ammo = weapon.data?.ammo;
    let ammoObject = {
      _id: "",
    };
    if (ammo) {
      ammoObject = JSON.parse(ammo);
      isShell = ammoObject?.isShell;
    }

    // If range is auto, then we look up range of token to target, else we use the range passed in
    let actualRange = 0;
    let dvs = [];
    if (range === "0to6") {
      actualRange = 6;
    } else if (range === "7to12") {
      actualRange = 12;
    } else if (range === "13to25") {
      actualRange = 25;
    } else if (range === "26to50") {
      actualRange = 50;
    } else if (range === "51to100") {
      actualRange = 100;
    } else if (range === "101to200") {
      actualRange = 200;
    } else if (range === "201to400") {
      actualRange = 400;
    } else if (range === "401to800") {
      actualRange = 800;
    } else {
      actualRange = 0;
    }
    if (actualRange > 0) {
      dvs.push({
        dv: getDvForRange(weapon, actualRange, type),
        targetName: "",
      });
    }
    // Find the skill for the record by name. Use Autofire if type is autofire.
    // (Suppresive Fire just produces macros for enemy's to roll Concentration)
    let skillName = weapon.data?.weaponSkill;

    if (type === "autofire" || type === "suppressive") {
      skillName = "Autofire";
    }

    let attackSkill = null;
    const skillGroups = [
      ...(record.data?.skillGroups1 || []),
      ...(record.data?.skillGroups2 || []),
    ];
    let attackSkillBase = 0;
    skillGroups.forEach((group) => {
      // We find the skill with the same name, or the Martial Arts skill with the highest base
      const skill = (group.data?.skills || []).find(
        (s) =>
          s.name === skillName ||
          (skillName === "Martial Arts" && group.name === "Martial Arts (x2)")
      );
      if (skill && skill.data?.base >= attackSkillBase) {
        // We found the skill, so we can roll it
        attackSkill = skill;
        attackSkillBase = skill.data?.base;
      }
    });

    let attackModifiers = [
      {
        name: skillName,
        value: attackSkillBase || 0,
        active: true,
        valueType: "number",
      },
    ];

    // TODO penalties for aimed shots

    // TODO add function to get modifiers from attachments and check

    let modifiers = getEffectsAndModifiersForToken(
      record,
      ["attackBonus", "attackPenalty"],
      "data.skills",
      isMelee ? "melee" : "ranged",
      weapon._id
    );

    attackModifiers.push(...attackModifiers);

    if (attackSkill) {
      const skillModifiers = getEffectsAndModifiersForToken(
        record,
        ["skillBonus", "skillPenalty"],
        attackSkill.name || "New Skill",
        weapon._id
      );
      attackModifiers.push(...skillModifiers);
    }

    // Filter out any duplicate modifiers (same name, value, and valueType)
    attackModifiers = attackModifiers.filter(
      (modifier, index, self) =>
        index ===
        self.findIndex(
          (t) =>
            t.name === modifier.name &&
            t.value === modifier.value &&
            t.valueType === modifier.valueType &&
            t.modifierType === modifier.modifierType
        )
    );

    if (range === "auto" && !isMelee && type !== "suppressive" && !isShell) {
      // Get targets, roll for each based on range to target (or just 1 if no targets)
      const targets = api.getTargets(record);
      if (targets.length > 0) {
        targets.forEach((target) => {
          const distance = target?.distance || 0;
          const dv = getDvForRange(weapon, distance, type);
          const targetName =
            target?.token?.identified === false
              ? target?.token?.record?.unidentifiedName
              : target?.token?.record?.name;
          dvs.push({
            dv: dv,
            targetName: targetName,
          });
        });
      }
    } else if (!isMelee && isShell) {
      // Shotgun is always DV 13
      dvs.push({
        dv: 13,
        targetName: "",
      });
    }

    // TODO get damage modifiers from character, attachments, and ammo
    // TODO set any other props needed in metadata for ammo that the damage macros need
    const damageModifiers = [];
    // TODO modifiers needed from ammo

    const attackMetadata = {
      rollName: "Attack",
      tooltip: `Attack with ${weapon.name}`,
      weaponName: weapon.name,
      isMelee: isMelee,
      isSuppressive: type === "suppressive",
      isAutofire: type === "autofire",
      weaponDamage: weapon.data?.damage || 0,
      autofireDamage: weapon.data?.autofireDamage || 0,
      afMultiplierMax: weapon.data?.afMultiplierMax || 0,
      damageModifiers: damageModifiers,
      dv: 0,
      icon: isMelee ? "GiKatana" : "GiPistolGun",
      targetName: "",
    };

    // Always true for Melee since it doesn't use ammo
    let hasEnoughAmmo = true;

    if (!isMelee) {
      // Get the ammo amount modifiers and deduct ammo if we have enough
      let ammoModifierType = "ammoPerShot";
      let ammoPerShot = 1;
      if (type === "autofire" || type === "suppressive") {
        ammoModifierType = "ammoPerAutofireShot";
        ammoPerShot = 10;
      }
      const ammoModifiers = getEffectsAndModifiersForToken(
        record,
        [ammoModifierType],
        "all",
        weapon._id
      );
      attackModifiers.push(...ammoModifiers);
      ammoModifiers.forEach((modifier) => {
        let value = parseInt(modifier.value, 10) || "0";
        if (!isNaN(value)) {
          value = 0;
        }
        ammoPerShot += value;
      });

      // Check if we have enough ammo in the weapon then deduct ammo
      const count = parseInt(weapon.data?.ammoCount, 10) || 0;
      if (count > 0 && count >= ammoPerShot) {
        const newCount = count - ammoPerShot;
        api.setValues({
          [`${weaponDataPath}.data.ammoCount`]: newCount,
        });
      } else {
        hasEnoughAmmo = false;
      }
    }

    // If we don't have enough ammo, then we need to show a message
    if (!hasEnoughAmmo) {
      api.showNotification("You need to reload first!", "red", "Out of Ammo");
      // No roll
      return;
    }

    // Now prompt for rolls
    if (dvs.length > 0) {
      dvs.forEach((dv) => {
        // Attack with this DV set
        api.promptRoll(
          `Attack with ${weapon.name}`,
          "1d10",
          attackModifiers,
          {
            ...attackMetadata,
            dv: dv.dv,
            targetName: dv.targetName,
          },
          "attack"
        );
      });
    } else {
      // For melee / supressive fire we roll the attack here (or auto-range but couldn't get targets)
      api.promptRoll(
        `Attack with ${weapon.name}`,
        "1d10",
        attackModifiers,
        attackMetadata,
        "attack"
      );
    }
  }

  function rollDamage() {
    //todo
  }

  function reload() {
    // Check if we have enough ammo then deduct ammo up to amount in magazine
    const weaponDataPath = getNearestParentDataPath(dataPath);
    const weapon = api.getValue(weaponDataPath);

    if (weapon.data?.type === "melee weapon") {
      return;
    }

    let magazineSize = weapon.data?.magazine || 0;
    // Check all attachments for magazine size, get largest
    const attachments = weapon.data?.attachments || [];
    attachments.forEach((attachment) => {
      if (
        attachment.data?.attachmentType === "magazine" &&
        attachment.data?.magazineSize > magazineSize &&
        attachment.data?.active
      ) {
        magazineSize = attachment.data?.magazineSize;
      }
    });

    const amountInWeapon = parseInt(weapon.data?.ammoCount, 10) || 0;
    const amountToReload = magazineSize - amountInWeapon;

    if (amountToReload <= 0) {
      return; // Already full
    }

    const ammo = weapon.data?.ammo;
    if (!ammo) {
      api.showNotification(
        "You need to select equipped ammo first!",
        "red",
        "No Ammo"
      );
      return;
    }

    const ammoObject = JSON.parse(ammo);

    let hasEnoughAmmo = false;
    const inventory = record.data?.inventory || [];
    inventory.forEach((item, index) => {
      if (item._id === ammoObject?._id) {
        const count = parseInt(item.data?.count, 10) || 0;
        if (count > 0) {
          // Calculate how much we can actually reload
          const amountToDeduct = Math.min(count, amountToReload);
          const newCount = count - amountToDeduct;
          api.setValues({
            [`data.inventory.${index}.data.count`]: newCount,
            [`${weaponDataPath}.data.ammoCount`]:
              amountInWeapon + amountToDeduct,
          });
          hasEnoughAmmo = true;
        }
      }
    });

    if (!hasEnoughAmmo) {
      api.showNotification("You are out of ammo!", "red", "Out of Ammo");
    }
  }

  function showHideAttachments() {
    const dataPathToWeapon = getNearestParentDataPath(dataPath);
    const weapon = api.getValue(dataPathToWeapon);

    let pathToAttachmentFields = "fields";
    if (dataPathToWeapon !== "") {
      pathToAttachmentFields = `${dataPathToWeapon}.fields`;
    }

    const showingAttachments = weapon?.fields?.attachments?.hidden !== true;
    const attachments = weapon?.data?.attachments || [];
    // If we're showing attachments list and we no have attachments, then hide it
    const showAttachments = attachments.length > 0;

    const dot = dataPathToWeapon !== "" ? "." : "";

    if (showingAttachments && !showAttachments) {
      api.setValues({
        [`${pathToAttachmentFields}.attachments.hidden`]: true,
      });
    } else if (!showingAttachments && showAttachments) {
      api.setValues({
        [`${pathToAttachmentFields}.attachments.hidden`]: false,
      });
    }

    // Hide the attack divider box if this is an attachment
    const isAttachment = dataPath.match(/\.data\.attachments\.\d+/) !== null;
    const isShowingAttackDivider =
      weapon?.fields?.attackDividerBox?.hidden !== true;
    if (isAttachment && isShowingAttackDivider) {
      api.setValues({
        [`${pathToAttachmentFields}.attackDividerBox.hidden`]: true,
        [`${pathToAttachmentFields}.attackDividerBox.hidden`]: true,
      });
    }
  }

  function onChangeAmmo(value) {
    const weaponDataPath = dataPath.replace(".data.ammo", "");
    const weapon = api.getValue(weaponDataPath);

    // Get the Ammo item
    const selectedAmmo = value;
    if (selectedAmmo) {
      const ammoId = JSON.parse(selectedAmmo)?._id;
      if (ammoId) {
        let ammoIndex = -1;
        const ammo = record.data.inventory.find((item, index) => {
          if (item._id === ammoId) {
            ammoIndex = index;
            return true;
          }
          return false;
        });
        if (ammo) {
          // Found the ammo
          const hasUseSpecial =
            ammo?.data?.damage ||
            (ammo?.data?.effects || []).length > 0 ||
            ammo?.data?.healing;
          api.setValues({
            [`${weaponDataPath}.fields.useSpecialBtn.hidden`]: !hasUseSpecial,
          });
        }
      }
    }
  }

  function getCyberwareWeaponFilters() {
    // Cyberware weapons are not carried, so we need to cancel that filter out
    const filters = [
      {
        field: "carried",
        operation: "not_equals",
        value: "carried",
        isOr: true,
      },
    ];
    return filters;
  }

  function ammoOptions() {
    // Get a list of equipped ammo
    const equippedAmmo = record.data?.inventory?.filter(
      (item) => item.data.carried === "equipped" && item.data.type === "ammo"
    );

    if (equippedAmmo.length > 0) {
      return equippedAmmo.map((ammo) => ({
        value: JSON.stringify({
          _id: ammo._id,
          name: ammo.name,
          isShell: ammo.data.isShell,
        }),
        label: ammo.name,
      }));
    } else {
      return [{ value: "none", label: "None" }];
    }
  }

  function useAmmo() {
    const weaponDataPath = dataPath.replace(".data.useSpecialBtn", "");
    const weapon = api.getValue(weaponDataPath);

    // Get the Ammo item
    const selectedAmmo = weapon?.data?.ammo;
    if (selectedAmmo) {
      const ammoId = JSON.parse(selectedAmmo)?._id;
      if (ammoId) {
        let ammoIndex = -1;
        const ammo = record.data.inventory.find((item, index) => {
          if (item._id === ammoId) {
            ammoIndex = index;
            return true;
          }
          return false;
        });
        if (ammo) {
          // Found the ammo, now use it
          useItem(`data.inventory.${ammoIndex}`);
        }
      }
    }
  }
</script>

      <namefield
        field="namefield"
        variant="standard"
        placeholder="Weapon Name..."
      ></namefield>
    </div>

    <!-- Buttons for Attacks, to be Shown/Hidden based on Weapon type -->

          flex-direction: row;
          gap: 2px;
          justify-content: center;
          width: 95px;

          size="md"

          variant="light"

          onclick="rollAttack('autofire')"
        ></iconbutton>
        <!-- Single Shot / Melee Attack -->
        <iconbutton
          size="md"
          hidden="false"
          variant="light"
          field="attackBtn"
          color="primary"
          options='[{"icon": "D10", "label": "Attack", "value": "attack"}]'
          onclick="rollAttack('single')"
        ></iconbutton>
        <!-- Suppressive Fire -->
        <iconbutton
          size="md"
          hidden="false"
          variant="light"
          field="suppressiveFireBtn"
          color="tertiary"
          options='[{"icon": "GiHeavyRain", "label": "Suppressive Fire", "value": "suppressiveFire"}]'
          onclick="rollAttack('suppressive')"
        ></iconbutton>
      </div>
      <!-- Reload -->
      <div
        style="
          display: flex;
          flex-direction: row;
          gap: 2px;
          align-items: center;
          width: 98px;
        "
      >
        <popover>
          <popover.target>
            <iconbutton
              size="md"
              hidden="false"
              field="attackByRangeBtn"
              variant="default"
              options='[{"icon": "IconRulerMeasure", "label": "Attack by Range", "value": "attackByRange"}]'
            ></iconbutton>
          </popover.target>
          <popover.dropdown>
            <div
              style="display: flex; flex-direction: column; max-width: 510px"
            >
              <box field="dvProperties">
                <!-- Here we show attack by range buttons -->
                <label
                  variant="bold"
                  label="Single Shot by Range"

                ></label>
                <div
                  style="
                    display: flex;
                    flex-direction: row;
                    gap: 2px;

                    justify-content: flex-start;
                  "

                    onclick="rollAttack('single', '0to6')"

                  <button

                    label="7 to 12 m/yds"
                    field="singleShot7to12Btn"
                    width="125px"
                    onclick="rollAttack('single', '7to12')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="13 to 25 m/yds"
                    field="singleShot13to25Btn"
                    width="125px"
                    onclick="rollAttack('single', '13to25')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="26 to 50 m/yds"
                    field="singleShot26to50Btn"
                    width="125px"
                    onclick="rollAttack('single', '26to50')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="51 to 100 m/yds"
                    field="singleShot51to100Btn"
                    width="125px"
                    onclick="rollAttack('single', '51to100')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="101 to 200 m/yds"
                    field="singleShot101to200Btn"
                    width="125px"
                    onclick="rollAttack('single', '101to200')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="201 to 400 m/yds"
                    field="singleShot201to400Btn"
                    width="125px"
                    onclick="rollAttack('single', '201to400')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="401 to 800 m/yds"
                    field="singleShot401to800Btn"
                    width="125px"
                    onclick="rollAttack('single', '401to800')"
                  ></button>
                </div>
              </box>
              <box field="afDvProperties">
                <!-- Here we show attack by range buttons -->
                <div style="margin-top: 4px">
                  <label
                    variant="bold"
                    label="Autofire by Range"
                    size="xs"
                  ></label>
                </div>
                <div
                  style="
                    display: flex;
                    flex-direction: row;
                    gap: 2px;
                    flex-wrap: wrap;
                    justify-content: flex-start;
                  "
                >
                  <button
                    size="xs"
                    variant="default"
                    label="0 to 6 m/yds"
                    field="autofire0to6Btn"
                    width="125px"
                    onclick="rollAttack('autofire', '0to6')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="7 to 12 m/yds"
                    field="autofire7to12Btn"
                    width="125px"
                    onclick="rollAttack('autofire', '7to12')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="13 to 25 m/yds"
                    field="autofire13to25Btn"
                    width="125px"
                    onclick="rollAttack('autofire', '13to25')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="26 to 50 m/yds"
                    field="autofire26to50Btn"
                    width="125px"
                    onclick="rollAttack('autofire', '26to50')"
                  ></button>
                  <button
                    size="xs"
                    variant="default"
                    label="51 to 100 m/yds"
                    field="autofire51to100Btn"
                    width="125px"
                    onclick="rollAttack('autofire', '51to100')"
                  ></button>

              </box>
            </div>
          </popover.dropdown>
        </popover>
        <button
          size="xs"
          hidden="false"
          field="reloadBtn"
          variant="default"
          label="Reload"
          onclick="reload()"
        ></button>
      </div>
    </div>

    <!-- Ammo List and Ammo Buttons -->
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
        min-width: 125px;
      "
    >
      <dropdown
        field="ammo"
        width="125px"
        size="xs"
        placeholder="Select Ammo..."
        optionsFunction="return ammoOptions();"
        onchange="onChangeAmmo(value);"
      ></dropdown>
      <button
        size="xs"
        width="125px"
        field="useSpecialBtn"
        variant="default"
        label="Use Special"
        icon="IconWalk"
        onclick="useAmmo();"
      ></button>

    <!-- Ammo Count and Damage Button -->

      style="
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
        width: fit-content;
      "
    >
      <button
        size="xs"
        width="100px"
        label="Damage"
        variant="light"
        color="primary"
        onclick="rollDamage();"

      <div

          size="xs"
          label="Ammo Remaining"
          width="60%"
          variant="tooltip"

            field="rof"
            size="xs"
            width="100%"
            variant="tooltip"
            label="Rate of Fire"
            placeholder="0"
            hidecontrols="true"
            editable="false"
          ></numberfield>
        </div>
      </div>
    </div>
  </div>
</box>
