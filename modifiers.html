<script>
  function onChangeModifierType() {
    const valuesToHide = [];
    const valuesToShow = [];

    if (value === "statBonus") {
      valuesToHide.push("field");
      valuesToHide.push("value");
      valuesToHide.push("smartBonus");
      valuesToHide.push("valueType");
      valuesToHide.push("active");
      valuesToHide.push("itemOnly");
      valuesToHide.push("statPenalty");
      valuesToHide.push("statMinimum");
      valuesToShow.push("stat");
      valuesToShow.push("statBonus");
      valuesToShow.push("statSet");
      valuesToShow.push("statMaximum");
      valuesToShow.push("noDerivedAttributes");
    } else if (value === "statPenalty") {
      valuesToHide.push("field");
      valuesToHide.push("value");
      valuesToHide.push("valueType");
      valuesToHide.push("smartBonus");
      valuesToHide.push("active");
      valuesToHide.push("itemOnly");
      valuesToHide.push("statBonus");
      valuesToHide.push("statMaximum");
      valuesToShow.push("stat");
      valuesToShow.push("statPenalty");
      valuesToShow.push("statSet");
      valuesToShow.push("statMinimum");
      valuesToShow.push("noDerivedAttributes");
    } else if (value === "smartAmmo") {
      valuesToShow.push("field");
      valuesToShow.push("value");
      valuesToShow.push("valueType");
      valuesToShow.push("smartBonus");
      valuesToShow.push("active");
      valuesToShow.push("itemOnly");
      valuesToHide.push("stat");
      valuesToHide.push("statBonus");
      valuesToHide.push("statPenalty");
      valuesToHide.push("statSet");
      valuesToHide.push("statMaximum");
      valuesToHide.push("statMinimum");
      valuesToHide.push("noDerivedAttributes");
    } else {
      valuesToShow.push("field");
      valuesToShow.push("value");
      valuesToShow.push("valueType");
      valuesToHide.push("smartBonus");
      valuesToShow.push("active");
      valuesToShow.push("itemOnly");
      valuesToHide.push("stat");
      valuesToHide.push("statBonus");
      valuesToHide.push("statPenalty");
      valuesToHide.push("statSet");
      valuesToHide.push("statMaximum");
      valuesToHide.push("statMinimum");
      valuesToHide.push("noDerivedAttributes");
    }

    if (valuesToHide.length > 0) {
      api.setHidden(valuesToHide, true, () => {
        if (valuesToShow.length > 0) {
          api.setHidden(valuesToShow, false);
        }
      });
    }
  }
</script>

<div style="display: flex; flex-direction: row; gap: 4px">

    {"label": "Skill Check Penalty", "value": "skillPenalty"},
    {"label": "Attack Bonus", "value": "attackBonus"}, 
    {"label": "Attack Penalty", "value": "attackPenalty"},
    {"label": "Initiative Bonus", "value": "initiativeBonus"},
    {"label": "Initiative Penalty", "value": "initiativePenalty"},

    {"label": "No Armor Ablation", "value": "noArmorAblation"},
